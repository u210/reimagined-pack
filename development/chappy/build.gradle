plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = '0.1.0'
group = 'jp.reimagined'
base { archivesName = 'chappy' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.244'
    runs {
        client { client(); gameDirectory = file('runtime/client') }
        server { server(); gameDirectory = file('runtime/server'); programArgument '--nogui' }
        validationServer { server(); gameDirectory = file('runtime/validation-server'); programArgument '--nogui'; systemProperty 'chappy.selftest', 'true' }
        knowledgeTestServer { server(); gameDirectory = file('runtime/knowledge-test-server'); programArgument '--nogui' }
    }
    mods { chappy { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { standardInput = System.in }

sourceSets {
    bookCheck {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('bookTextCheck', JavaExec) {
    dependsOn bookCheckClasses
    classpath = sourceSets.bookCheck.runtimeClasspath
    mainClass = 'jp.reimagined.chappy.BookTextCheck'
}
tasks.named('check') { dependsOn 'bookTextCheck' }

dependencies { implementation files('runtime/deps/exposure-neoforge-1.21.1-1.9.18.jar') }
