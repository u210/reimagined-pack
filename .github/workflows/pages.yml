name: Publish packwiz pack

on:
  push:
    branches:
      - main
    paths:
      - 'pack/**'
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check pack entry points
        shell: bash
        run: |
          test -f pack/pack.toml
          test -f pack/index.toml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp -a pack/. _site/
          cp dist/Reimagined-Packwiz.zip _site/downloads/

      - name: Audit hidden pack files
        shell: bash
        run: |
          unexpected_hidden="$(find _site -type f -path '*/.*' \
            ! -path '_site/config/plasmovoice/.crowdin/*' \
            ! -path '_site/config/plasmovoice/server/languages/.crowdin/*' \
            ! -path '_site/config/pv-addon-priority/languages/.crowdin/*' \
            ! -path '_site/shaderpacks/complementaryreimagined_r5.8.1 + euphoriapatches_1.9.3/.gitignore')"
          if [ -n "$unexpected_hidden" ]; then
            echo "Unexpected hidden files:" >&2
            echo "$unexpected_hidden" >&2
            exit 1
          fi
          test -f _site/config/plasmovoice/.crowdin/ja_jp.json
          test -f _site/config/plasmovoice/server/languages/.crowdin/ja_jp.toml

      - name: Archive Pages artifact with hidden pack files
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory _site \
            --exclude=.git \
            --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .

      - name: Upload pack and bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
