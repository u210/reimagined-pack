name: Publish packwiz pack

on:
  push:
    branches:
      - main
    paths:
      - 'pack/**'
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check pack entry points
        shell: bash
        run: |
          test -f pack/pack.toml
          test -f pack/index.toml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp -a pack/. _site/
          cp dist/Reimagined-Packwiz.zip _site/downloads/

      - name: Upload pack and bootstrap
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
